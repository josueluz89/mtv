name: build-apk

# En push a main: compila el APK debug y lo deja como artifact.
# Nota: NO usar actions/setup-android (v3 está roto); SDK manual con cmdline-tools.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMGR=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMGR --licenses > /dev/null
          $SDKMGR "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

name: build-apk

# En push a main: compila el APK debug y lo deja como artifact.
# En push de un tag v* (ej. v1.3.1): además publica un GitHub Release con el
# APK siempre bajo el mismo nombre de archivo (mtv-latest.apk), para que el
# link fijo https://github.com/josueluz89/mtv/releases/latest/download/mtv-latest.apk
# siempre descargue la última versión sin cambiar nada.
# Nota: NO usar actions/setup-android (v3 está roto); SDK manual con cmdline-tools.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMGR=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMGR --licenses > /dev/null
          $SDKMGR "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;27.1.12297006" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV

      # FFmpeg LGPL 2.1+ (--disable-gpl --disable-nonfree) para el respaldo de
      # audio del módulo :decoder_ffmpeg. Se compila desde el fuente oficial.
      - name: Build FFmpeg (LGPL) for ARM
        run: |
          set -e
          MOD=$PWD/decoder_ffmpeg/src/main
          git clone --depth 1 -b release/6.0 https://git.ffmpeg.org/ffmpeg.git "$MOD/jni/ffmpeg"
          HOST=$(uname -s | tr '[:upper:]' '[:lower:]')-x86_64
          chmod +x "$MOD/jni/build_ffmpeg.sh"
          "$MOD/jni/build_ffmpeg.sh" "$MOD" "$ANDROID_NDK_HOME" "$HOST" 26 \
            vorbis opus flac alac pcm_mulaw pcm_alaw mp3 aac ac3 eac3 dca mlp truehd
          echo "FFmpeg compilado:"
          find "$MOD/jni/ffmpeg/android-libs" -name "*.a" | head -8

      - name: Upload FFmpeg libs artifact (LGPL §6)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-lgpl-libs
          path: decoder_ffmpeg/src/main/jni/ffmpeg/android-libs

      - name: Build debug APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mtv-latest.apk
          gh release create "${{ github.ref_name }}" mtv-latest.apk \
            --title "MTV ${{ github.ref_name }}" \
            --generate-notes
